name: Scheduled Run

on:
  schedule:
    - cron: '13 11 * * 0-6'      # At 11:13 on every day-of-week from Sunday through Saturday
    - cron: '0 9 * * 1'      # every Monday at 09:00 UTC

jobs:
  scheduled-task:
    runs-on: ubuntu-latest
    steps:
      - name: Nightly housekeeping
        run: echo "Running scheduled job at $(date -u)."
